name = "worker"
main = "src/index.ts"
compatibility_date = "2025-02-15"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 1

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[assets]
directory = "../desktop/dist"
binding = "ASSETS"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]
